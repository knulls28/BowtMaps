<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Shield Gradient -->
    <radialGradient id="shieldGradM" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#182535" />
      <stop offset="55%" stop-color="#0e1722" />
      <stop offset="100%" stop-color="#070b10" />
    </radialGradient>

    <!-- Sheikah Cyan Energy Gradient -->
    <linearGradient id="sheikahCyanM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="75%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Master Sword & Triforce Gold Gradient -->
    <linearGradient id="hylianGoldM" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#fcd34d" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Dark Metal Rim Gradient -->
    <linearGradient id="rimMetalM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glowing Filter -->
    <filter id="glowCyanM" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowGoldM" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blurGold" />
      <feMerge>
        <feMergeNode in="blurGold" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Full bleed dark background for maskable icon -->
  <rect width="512" height="512" fill="#070b10" />

  <!-- Inner safe zone (76% scale centered at 256, 256) -->
  <g transform="translate(61.4, 61.4) scale(0.76)">
    <!-- Outer Emblem Shield -->
    <polygon points="150,16 362,16 496,150 496,362 362,496 150,496 16,362 16,150"
             fill="url(#shieldGradM)" stroke="url(#rimMetalM)" stroke-width="8" stroke-linejoin="round" />

    <polygon points="154,28 358,28 484,154 484,358 358,484 154,484 28,358 28,154"
             fill="none" stroke="url(#hylianGoldM)" stroke-width="3" opacity="0.75" stroke-linejoin="round" />

    <!-- Ancient Sheikah Constellation & Circuit Ring -->
    <circle cx="256" cy="268" r="190" fill="none" stroke="#1e293b" stroke-width="3" />
    <circle cx="256" cy="268" r="176" fill="none" stroke="#0284c7" stroke-width="2" stroke-dasharray="14 10 4 10" opacity="0.6" />
    <circle cx="256" cy="268" r="162" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.4" />

    <!-- 8 Sheikah Circuit Nodes -->
    <circle cx="256" cy="78" r="4" fill="#38bdf8" />
    <circle cx="446" cy="268" r="4" fill="#38bdf8" />
    <circle cx="256" cy="458" r="4" fill="#38bdf8" />
    <circle cx="66" cy="268" r="4" fill="#38bdf8" />
    <circle cx="390" cy="134" r="3" fill="#fcd34d" />
    <circle cx="390" cy="402" r="3" fill="#38bdf8" />
    <circle cx="122" cy="402" r="3" fill="#38bdf8" />
    <circle cx="122" cy="134" r="3" fill="#fcd34d" />

    <!-- TRIFORCE (Top Golden Emblem) -->
    <g filter="url(#glowGoldM)" transform="translate(0, -6)">
      <polygon points="256,54 220,114 292,114" fill="url(#hylianGoldM)" stroke="#fef08a" stroke-width="1.5" stroke-linejoin="round" />
      <polygon points="220,114 184,174 256,174" fill="url(#hylianGoldM)" stroke="#fef08a" stroke-width="1.5" stroke-linejoin="round" />
      <polygon points="292,114 256,174 328,174" fill="url(#hylianGoldM)" stroke="#fef08a" stroke-width="1.5" stroke-linejoin="round" />
    </g>

    <!-- Winged Royal Crest / Sheikah Circuit Accents flanking -->
    <g opacity="0.8" filter="url(#glowCyanM)">
      <path d="M184 174 C150 176 100 200 70 238 C100 236 130 230 158 216" fill="none" stroke="url(#hylianGoldM)" stroke-width="4" stroke-linecap="round" />
      <path d="M168 196 C136 210 94 234 80 266 C106 258 136 250 162 236" fill="none" stroke="url(#sheikahCyanM)" stroke-width="3" stroke-linecap="round" />

      <path d="M328 174 C362 176 412 200 442 238 C412 236 382 230 354 216" fill="none" stroke="url(#hylianGoldM)" stroke-width="4" stroke-linecap="round" />
      <path d="M344 196 C376 210 418 234 432 266 C406 258 376 250 350 236" fill="none" stroke="url(#sheikahCyanM)" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- SHEIKAH EYE OF TRUTH -->
    <g filter="url(#glowCyanM)">
      <path d="M256 186 L256 226" stroke="url(#sheikahCyanM)" stroke-width="10" stroke-linecap="round" />
      <path d="M214 198 L228 232" stroke="url(#sheikahCyanM)" stroke-width="8" stroke-linecap="round" />
      <path d="M298 198 L284 232" stroke="url(#sheikahCyanM)" stroke-width="8" stroke-linecap="round" />

      <path d="M148 290 Q256 210 364 290" fill="none" stroke="url(#sheikahCyanM)" stroke-width="12" stroke-linecap="round" />
      <path d="M148 290 Q256 370 364 290" fill="none" stroke="url(#sheikahCyanM)" stroke-width="12" stroke-linecap="round" />

      <path d="M172 290 Q256 232 340 290" fill="none" stroke="#a5f3fc" stroke-width="3" opacity="0.8" />
      <path d="M172 290 Q256 348 340 290" fill="none" stroke="#a5f3fc" stroke-width="3" opacity="0.8" />

      <circle cx="256" cy="290" r="38" fill="#08101a" stroke="url(#sheikahCyanM)" stroke-width="7" />
      <circle cx="256" cy="290" r="22" fill="url(#sheikahCyanM)" />
      <circle cx="256" cy="290" r="10" fill="#ffffff" />

      <path d="M256 346 C256 346 238 388 238 414 C238 434 246 446 256 446 C266 446 274 434 274 414 C274 388 256 346 256 346 Z"
            fill="url(#sheikahCyanM)" />
      <circle cx="256" cy="420" r="6" fill="#ffffff" opacity="0.9" />
    </g>

    <circle cx="256" cy="470" r="5" fill="url(#hylianGoldM)" />
  </g>
</svg>
