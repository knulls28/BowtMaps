<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e2338" />
      <stop offset="60%" stop-color="#0a121c" />
      <stop offset="100%" stop-color="#06090e" />
    </radialGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="512" height="512" rx="108" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="#1e293b" stroke-width="4" />

  <!-- Outer Sheikah ring -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="#0e3352" stroke-width="3" stroke-dasharray="10 8" />
  <circle cx="256" cy="256" r="198" fill="none" stroke="#38bdf8" stroke-width="5" opacity="0.8" />
  <circle cx="256" cy="256" r="182" fill="none" stroke="#0284c7" stroke-width="2" opacity="0.6" stroke-dasharray="4 6" />

  <!-- Four cardinal notches -->
  <line x1="256" y1="42" x2="256" y2="70" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />
  <line x1="256" y1="442" x2="256" y2="470" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />
  <line x1="42" y1="256" x2="70" y2="256" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />
  <line x1="442" y1="256" x2="470" y2="256" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />

  <!-- Sheikah Crest Elements -->
  <g filter="url(#neonGlow)">
    <!-- Top 3 Prongs/Eyelashes -->
    <path d="M256 128 L256 172" stroke="url(#cyanGlow)" stroke-width="12" stroke-linecap="round" />
    <path d="M208 142 L224 182" stroke="url(#cyanGlow)" stroke-width="10" stroke-linecap="round" />
    <path d="M304 142 L288 182" stroke="url(#cyanGlow)" stroke-width="10" stroke-linecap="round" />

    <!-- Upper and Lower Eye Eyelids (Arc) -->
    <path d="M140 250 Q256 170 372 250" fill="none" stroke="url(#cyanGlow)" stroke-width="14" stroke-linecap="round" />
    <path d="M140 250 Q256 330 372 250" fill="none" stroke="url(#cyanGlow)" stroke-width="14" stroke-linecap="round" />

    <!-- Center Iris Outer & Inner -->
    <circle cx="256" cy="250" r="42" fill="#091422" stroke="url(#cyanGlow)" stroke-width="8" />
    <circle cx="256" cy="250" r="22" fill="url(#cyanGlow)" />
    <circle cx="256" cy="250" r="10" fill="#ffffff" />

    <!-- Sheikah Teardrop descending from center -->
    <path d="M256 304 C256 304 236 348 236 376 C236 398 245 410 256 410 C267 410 276 398 276 376 C276 348 256 304 256 304 Z" fill="url(#cyanGlow)" />
    <circle cx="256" cy="382" r="7" fill="#ffffff" opacity="0.8" />
  </g>
</svg>
